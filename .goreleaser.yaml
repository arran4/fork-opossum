project_name: mycel
builds:
  -
    id: "mycel"
    binary: "mycel"
    dir: cmd/mycel
  -
    id: "sparklefs"
    binary: "sparklefs"
    package: github.com/psilva261/sparklefs/cmd/sparklefs
archives:
  -
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
nfpms:
  -
    vendor: Philip Silva
    homepage: https://github.com/psilva261/mycel
    maintainer: Philip Silva <psilva261@github.com>
    description: NA
    license: bsd
    formats:
      - apk
      - deb
      - rpm
    release: 1
    section: default
    priority: extra
